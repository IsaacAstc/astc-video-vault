# LMS 규칙 단방향 동기화 + 자동 배포 워크플로 (통합 브랜치: main).
# IsaacAstc/lms 의 firestore.rules(원문)가 바뀌면, 이 저장소 병합본의 [A] 구간을
# 교체해 main에 직접 커밋하고, 검증(check-rules.sh) 통과 시 Firebase에 규칙을
# 자동 배포한다. LMS 저장소는 public이라 토큰 없이 읽기만 하며,
# LMS 저장소에는 아무것도 추가·수정하지 않는다.
#
# - 브랜치 통합: PR 방식 대신 main 직접 커밋 — 사람이 할 일은 실행(또는 매일 자동) 뿐.
# - 안전장치: [A]·[B] 필수 블록 검증(check-rules.sh)을 통과해야만 커밋·배포한다.
# - 자동 배포는 FIREBASE_SERVICE_ACCOUNT / FIREBASE_PROJECT_ID 시크릿이 등록된
#   경우에만 동작(미등록 시 커밋까지만 하고 수동 배포 안내).
name: LMS 규칙 동기화·배포

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch: {} # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: lms-rules-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: LMS 규칙 원문 다운로드
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/IsaacAstc/lms/main/firestore.rules \
            -o /tmp/lms-firestore.rules

      - name: 병합본 [A] 구간 교체
        id: sync
        run: |
          result=$(python3 scripts/sync-lms-rules.py /tmp/lms-firestore.rules)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "동기화 결과: $result"

      - name: 병합본 필수 블록 검증
        if: steps.sync.outputs.result == 'CHANGED'
        run: ./scripts/check-rules.sh

      - name: main에 직접 커밋
        if: steps.sync.outputs.result == 'CHANGED'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "LMS 규칙 변경 동기화 — [A] 구간을 IsaacAstc/lms 원문으로 교체"
          git push origin HEAD:main

      - name: 배포 시크릿 확인
        id: check
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret이 없어 규칙 자동 배포를 건너뜁니다. 병합본을 수동 배포하세요 (README 5절)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # 규칙 배포: 변경이 있었거나 수동 실행일 때(재배포 용도) 수행.
      - uses: google-github-actions/auth@v2
        if: steps.check.outputs.ok == 'true' && (steps.sync.outputs.result == 'CHANGED' || github.event_name == 'workflow_dispatch')
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Firestore 규칙 배포 (병합본)
        if: steps.check.outputs.ok == 'true' && (steps.sync.outputs.result == 'CHANGED' || github.event_name == 'workflow_dispatch')
        run: |
          ./scripts/check-rules.sh
          npx --yes firebase-tools@latest deploy --only firestore:rules \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --non-interactive --force
